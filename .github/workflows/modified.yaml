name: Python package and test

# CINTENT >> MANUAL TRIGGER
# on:
#   push:
#   pull_request:
on: [repository_dispatch, workflow_dispatch]

jobs:
  checkout-test:
    name: Checkout and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # CINTENT >> UNSUPPORTED_OS
        # os: ["macos-latest", "ubuntu-latest"]
        os: ["ubuntu-latest"]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CINTENT >> INSERT_CINTENT
      - uses: JavidDitty/setup-cintent@a606c80c34ec190c6a20dea33d6d58ddb6c4e0cc

      - name: Create python 3.11 conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.11
          mamba-version: "*"
          activate-environment: donkey
          auto-activate-base: false
          channels: default, conda-forge, pytorch
          channel-priority: true

      - name: Conda info and list
        run: |
          conda info
          conda list

      - name: Install donkey
        run: | 
          pip install -e .[pc,dev]
          pip list

      - name: Run tests
        run: pytest

      # CINTENT >> INSERT_CINTENT
      - name: Upload CIntent Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CINTENT_ARTIFACT_NAME }}
          path: ${{ env.CINTENT_LOGS }}